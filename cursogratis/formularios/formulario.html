<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
        <!-- los tipos de inputs mas comunes que existen -->
        <input type="text" required minlength="2" maxlength="100"> <!-- el required indica que el campo es obligatorio -->
        <br> <!-- el minlength y maxlength indican la cantidad minima y maxima de caracteres que se pueden ingresar en el campo de texto -->
        <br>
        <input type="date" place>
        <br>
        <br>
        <input type="color" name="color"> <!--el name sirve para identificar el campo en la base de datos -->
        <br>
        <br>
        <input type="email" placeholder="correo electronico"> <!-- el placeholder es un texto que aparece dentro del campo de texto para indicar al usuario que tipo de informacion debe ingresar -->
        <br>
        <br>
        <input type="password">
        <br>
        <br>
        <input type="checkbox"> <!-- sirve para seleccionar una o varias opciones -->
        <br>
        <br>
        <input type="radio"> <!-- sirve para elegir una sola opcion entre varias opciones -->
        <br>
        <br>
        <input type="submit"> <!-- sirve para enviar el formulario -->
        <br>
        <br>
        <input type="file">  <!-- sirve para subir un archivo que este en tu dispositivo -->
        <br>
        <br>
        <input type="date"> <!-- sirve para seleccionar una fecha -->
    </form>
</body>
</html>
